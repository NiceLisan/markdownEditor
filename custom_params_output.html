<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Parameters Test</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #fff;
      }
      .preview-wrapper {
        max-width: 750px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div
      class="preview-wrapper"
      id="preview-wrapper"
      style="
        --md-primary-color: #11a4beb8;
        --md-font-family: -apple-system-font, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Hiragino Sans GB,
          Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif;
        --md-font-size: 16px;
        font-family: -apple-system-font, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Hiragino Sans GB,
          Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif;
        font-size: 16px;
      "
    >
      <section
        class="preview-content"
        style="
          font-family: -apple-system-font, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Hiragino Sans GB,
            Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif;
          font-size: 16px;
          line-height: 1.75;
          text-align: left;
        "
      >
        <section
          class="container"
          style="
            font-family: -apple-system-font, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Hiragino Sans GB,
              Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.75;
            text-align: left;
          "
        >
          <blockquote
            class="md-blockquote"
            style="
              margin-bottom: 1em;
              margin: 0;
              padding: 2px 4px;
              background: linear-gradient(135deg, #f0f8ff 0%, #e6f3ff 100%);
              color: #4169e1;
              font-style: italic;
              border-left: 4px solid #87ceeb;
              border-radius: 0 10px 10px 0;
              box-shadow: 0 2px 8px rgba(135, 206, 235, 0.15);
            "
          >
            <p
              class="md-blockquote-p"
              style="
                line-height: 1.8;
                display: block;
                font-size: 1em;
                letter-spacing: 0.1em;
                margin: 0;
                color: #4169e1;
                font-weight: 500;
              "
            >
              字数 20，阅读大约需 1 分钟
            </p>
          </blockquote>
          <h1
            class="h1"
            data-heading="true"
            style="
              display: table;
              padding: 0 1em;
              border-bottom: 2px solid #11a4beb8;
              text-align: center;
              font-size: 22.4px;
              font-weight: 800;
              color: #ff69b4;
              margin: 30px 8px 25px;
              letter-spacing: 0.5px;
            "
          >
            自定参数测试\n\n这是一段测试文本。\n\n<a
              href="https://example.com"
              title="链接"
              style="
                color: #40e0d0;
                text-decoration: none;
                border-bottom: 1px solid rgba(64, 224, 208, 0.3);
                transition: color 0.2s ease, border-color 0.2s ease;
              "
              >链接<sup>[1]</sup></a
            >
          </h1>
          <h4
            class="h4"
            data-heading="true"
            style="font-size: 16.8px; font-weight: 700; color: #ff69b4; margin: 18px 8px 12px"
          >
            引用链接
          </h4>
          <p
            class="footnotes"
            style="letter-spacing: 0.1em; line-height: 1.8; margin: 0.5em 8px; font-size: 80%; color: #333"
          >
            <code
              style="
                color: #d14;
                background: rgba(27, 31, 35, 0.05);
                padding: 3px 5px;
                border-radius: 4px;
                font-size: 90%;
                opacity: 0.6;
              "
              >[1]</code
            >
            链接: <i style="word-break: break-all">https://example.com</i><br />
          </p>
          <style>
            .preview-wrapper pre::before {
              position: absolute;
              top: 0;
              right: 0;
              color: #ccc;
              text-align: center;
              font-size: 0.8em;
              padding: 5px 10px 0;
              line-height: 15px;
              height: 15px;
              font-weight: 600;
            }
          </style>

          <style>
            .hljs.code__pre > .mac-sign {
              display: flex;
            }
          </style>

          <style>
            h2 strong {
              color: inherit !important;
            }
          </style>
        </section>
      </section>
    </div>
  </body>
</html>
