<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rainbow Theme NO DEFAULT Test</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #fff;
      }
      .preview-wrapper {
        max-width: 750px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div
      class="preview-wrapper"
      id="preview-wrapper"
      style="
        --md-primary-color: #0f4c81;
        --md-font-family: -apple-system-font, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Hiragino Sans GB,
          Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif;
        --md-font-size: 16px;
        font-family: -apple-system-font, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Hiragino Sans GB,
          Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif;
        font-size: 16px;
      "
    >
      <section
        class="preview-content"
        style="
          font-family: -apple-system-font, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Hiragino Sans GB,
            Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif;
          font-size: 16px;
          line-height: 1.75;
          text-align: left;
        "
      >
        <section
          class="container"
          style="
            font-family: -apple-system-font, BlinkMacSystemFont, Helvetica Neue, PingFang SC, Hiragino Sans GB,
              Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.75;
            text-align: left;
          "
        >
          <h1
            class="h1"
            data-heading="true"
            style="font-size: 22.4px; font-weight: 800; color: #ff69b4; margin: 30px 8px 25px; letter-spacing: 0.5px"
          >
            Hello Rainbow\n\n<strong class="strong" style="color: #0f4c81">wow</strong>
          </h1>
          <style>
            .preview-wrapper pre::before {
              position: absolute;
              top: 0;
              right: 0;
              color: #ccc;
              text-align: center;
              font-size: 0.8em;
              padding: 5px 10px 0;
              line-height: 15px;
              height: 15px;
              font-weight: 600;
            }
          </style>

          <style>
            .hljs.code__pre > .mac-sign {
              display: flex;
            }
          </style>

          <style>
            h2 strong {
              color: inherit !important;
            }
          </style>
        </section>
      </section>
    </div>
  </body>
</html>
